name: Lighthouse CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Cloudflare Worker bundle
        run: npm run build:deploy
        env:
          DEPLOY_SITE_ORIGIN: https://preview.himalayankoh.com
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
